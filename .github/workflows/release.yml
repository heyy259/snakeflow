name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: mac-arm64
          - os: macos-13
            platform: mac-x64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm run build:server
      - name: Assemble portable artifact
        run: node scripts/assemble-release.mjs --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: snakeflow-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
